name: Deploy React to GitHub Pages

on:
  push:
    branches: React # change to your branch name

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: React # change to your branch name

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          cd reactProj
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./reactProj/build  # or ./reactProj/build if using CRA

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
